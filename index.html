<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sponsor Timeline</title>
<style>
:root{--bg:#f6f6f7;--c:#fff;--t:#111;--m:#6b7280;--b:#e5e7eb;--a:#2563eb;--r:#dc2626;--g:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e10;--c:#18181b;--t:#f4f4f5;--m:#9ca3af;--b:#2c2c31;--a:#60a5fa;--r:#f87171;--g:#4ade80}}
:root[data-theme=dark]{--bg:#0e0e10;--c:#18181b;--t:#f4f4f5;--m:#9ca3af;--b:#2c2c31;--a:#60a5fa;--r:#f87171;--g:#4ade80}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--t);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;min-height:100%}nav{width:210px;background:var(--c);border-right:1px solid var(--b);padding:16px 10px;position:sticky;top:0;height:100vh;flex:none}
nav h1{font-size:16px;margin:0 8px 16px}nav h1 span{color:var(--a)}nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--m);cursor:pointer;margin-bottom:2px}nav a.on{background:var(--a);color:#fff}
main{flex:1;padding:22px;min-width:0;max-width:1100px}h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 8px;font-size:14px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.cd{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}.st b{display:block;font-size:20px}.st span{color:var(--m);font-size:12px}
.bt{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}.bt.p{background:var(--a);border-color:var(--a);color:#fff}.bt.d{color:var(--r)}.bt.s{padding:3px 8px;font-size:12px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tb input,.tb select{width:auto;flex:1;min-width:110px}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-weight:500;font-size:12px}
.bg{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--b)}.bg.late{background:var(--r);color:#fff}.bg.ok{background:var(--g);color:#000}
.bar{height:8px;background:var(--b);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--a)}
.li{padding:8px 0;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;gap:8px}.li:last-child{border:0}.mu{color:var(--m);font-size:12px}.em{color:var(--m);padding:14px 0;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div.h{text-align:center;color:var(--m);font-size:12px}.dy{min-height:70px;background:var(--c);border:1px solid var(--b);border-radius:8px;padding:4px;cursor:pointer;overflow:hidden}.dy.sel{border-color:var(--a)}.dy.td{background:color-mix(in srgb,var(--a) 12%,var(--c))}.dy small{color:var(--m)}
.ev{display:block;font-size:11px;border-radius:4px;padding:0 4px;margin-top:2px;background:var(--a);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ev.dn{opacity:.45}
#modal{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}#modal.on{display:flex}.md{background:var(--c);border-radius:12px;padding:18px;width:100%;max-width:560px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{font-size:12px;color:var(--m)}.fg label.w{grid-column:1/-1}.md .bar{display:flex;justify-content:flex-end;gap:8px;background:none;height:auto;margin-top:14px;overflow:visible}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:30}
@media(max-width:760px){#app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;display:flex;overflow-x:auto;padding:6px calc(6px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-bottom,0px));z-index:10;border-top:1px solid var(--b);border-right:0}nav h1{display:none}nav a{white-space:nowrap;margin:0 2px}main{padding:14px 12px 90px}.fg{grid-template-columns:1fr}.dy{min-height:52px}.ev{font-size:0;height:6px;padding:0}}
</style></head><body><div id="app"><div class="em" style="margin:40px auto">Memuat…</div></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C={sp:'sponsors',ev:'events',cm:'comms',ac:'activity',mem:'members'};
const STS=['Belum dihubungi','Akan dihubungi','Sudah dihubungi','Menunggu respons','Perlu follow-up','Negosiasi','Diterima','Ditolak','Tidak ada respons'];
const CATS=['Riset calon sponsor','Menghubungi sponsor','Mengirim proposal','Follow-up','Negosiasi','Konfirmasi kerja sama','Pengumpulan logo dan materi publikasi','Pemenuhan kesepakatan sponsor','Evaluasi dan laporan sponsorship','Rapat internal'];
const EST=['Belum dimulai','Sedang berjalan','Selesai'],METH=['WhatsApp','Telepon','Email','Pertemuan langsung','Lainnya'],TYP=['Uang','Barang','Jasa'];
const MENU=[['dash','Dashboard'],['cal','Timeline Kalender'],['sp','Daftar Sponsor'],['fu','Follow-up'],['ag','Agenda'],['tim','Anggota Tim'],['tg','Target Dana'],['set','Pengaturan']];
let S={sp:[],ev:[],cm:[],ac:[],mem:[],set:{}},db,U,ME,NM={},P='dash',SID=null,CM=new Date(2026,9,1),SEL=null,FT='today',AF='',F={q:'',st:'',cat:'',own:'',sort:'name'},ready=0,joined=0;
const col=k=>db.collection(C[k]),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('sv',{timeZone:'Asia/Jakarta'});
const fd=d=>d?new Date(d+'T12:00:00+07:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jakarta'}):'—';
const ft=t=>t?new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}):'';
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const nm=i=>i?(NM[i]||'Anggota'):'—',sp=i=>S.sp.find(x=>x.id===i),spn=i=>sp(i)?.name||'—';
const isAdmin=()=>S.mem.find(m=>m.id===ME)?.role==='Admin';
const eff=e=>e.status!=='Selesai'&&(e.deadline||e.date)<today()?'Terlambat':e.status;
function toast(m,e){const t=$('#toast');t.textContent=m;t.style.background=e?'var(--r)':'';t.style.color=e?'#fff':'';t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
async function save(k,o){const id=o.id||uid(),r={...o};delete r.id;r.upd=Date.now();if(!o.id)r.cr=Date.now();try{await col(k).doc(id).set(r);return id}catch(e){toast('Gagal menyimpan: '+(e.message||e),1)}}
async function del(k,id){try{await col(k).doc(id).delete()}catch(e){toast('Gagal menghapus',1)}}
const log=(text,sid,type)=>save('ac',{text,sid:sid||'',type:type||'',by:ME,at:Date.now()});
function form(title,fs,v,cb){const m=$('#modal');m.innerHTML=`<div class=md><h3>${title}</h3><div class=fg>${fs.map(f=>`<label class="${f.w?'w':''}">${f.l}${f.req?' *':''}${f.t==='select'?`<select name=${f.k}>${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}" ${a==v[f.k]?'selected':''}>${esc(b)}</option>`}).join('')}</select>`:f.t==='textarea'?`<textarea name=${f.k} rows=3>${esc(v[f.k]||'')}</textarea>`:`<input name=${f.k} type=${f.t||'text'} value="${esc(v[f.k]??'')}">`}</label>`).join('')}</div><div class=bar><button class=bt onclick=closeM()>Batal</button><button class="bt p" id=sv>Simpan</button></div></div>`;m.classList.add('on');
$('#sv').onclick=async()=>{const o={};for(const f of fs){const x=m.querySelector('[name='+f.k+']').value.trim();if(f.req&&!x)return toast(f.l+' wajib diisi',1);o[f.k]=f.t==='number'?+x||0:x}await cb(o);closeM()}}
const closeM=()=>$('#modal').classList.remove('on');
const mo=(e)=>[['','— Belum ditentukan —'],...S.mem.map(m=>[m.id,nm(m.id)])];
const so=()=>[['','— Tanpa sponsor —'],...S.sp.map(s=>[s.id,s.name])];
/* FORMS */
function spForm(id){const s=id?sp(id):{status:STS[0],type:'Uang',owner:ME};
form(id?'Edit Sponsor':'Tambah Sponsor',[{k:'name',l:'Nama sponsor / brand',req:1,w:1},{k:'cat',l:'Kategori usaha'},{k:'pic',l:'Nama PIC'},{k:'wa',l:'WhatsApp / telepon'},{k:'email',l:'Email',t:'email'},{k:'web',l:'Media sosial / website'},{k:'addr',l:'Alamat'},{k:'first',l:'Pertama dihubungi',t:'date'},{k:'owner',l:'Penanggung jawab',t:'select',o:mo()},{k:'status',l:'Status',t:'select',o:STS},{k:'next',l:'Follow-up berikutnya',t:'date'},{k:'type',l:'Jenis kontribusi',t:'select',o:TYP},{k:'est',l:'Estimasi nilai (Rp)',t:'number'},{k:'conf',l:'Terkonfirmasi (Rp)',t:'number'},{k:'recv',l:'Diterima (Rp)',t:'number'},{k:'note',l:'Catatan',t:'textarea',w:1}],s,async o=>{
if(!id&&S.sp.some(x=>x.name.toLowerCase()===o.name.toLowerCase())&&!confirm('Sponsor dengan nama ini sudah terdaftar. Tetap tambahkan?'))return;
const n={...s,...o};const nid=await save('sp',n);if(!nid)return;
if(!id)log('menambahkan sponsor '+o.name,nid);else{if(s.status!==o.status)log(`mengubah status ${o.name}: ${s.status} → ${o.status}`,id,'status');if(s.owner!==o.owner)log(`mengubah penanggung jawab ${o.name} menjadi ${nm(o.owner)}`,id);if(s.est!==o.est||s.conf!==o.conf||s.recv!==o.recv)log(`memperbarui nilai kontribusi ${o.name}`,id)}toast('Sponsor tersimpan')})}
function setStatus(id,v){const s=sp(id);if(s.status===v)return;save('sp',{...s,status:v});log(`mengubah status ${s.name}: ${s.status} → ${v}`,id,'status');toast('Status diperbarui')}
function evForm(id,pre){const e=id?S.ev.find(x=>x.id===id):{status:'Belum dimulai',cat:CATS[0],date:SEL||today(),...pre};
form(id?'Edit Agenda':'Tambah Agenda',[{k:'title',l:'Judul agenda',req:1,w:1},{k:'date',l:'Tanggal',t:'date',req:1},{k:'time',l:'Jam',t:'time'},{k:'cat',l:'Kategori',t:'select',o:CATS},{k:'sid',l:'Sponsor terkait',t:'select',o:so()},{k:'who',l:'Penanggung jawab',t:'select',o:mo()},{k:'deadline',l:'Tenggat',t:'date'},{k:'status',l:'Status',t:'select',o:EST},{k:'note',l:'Catatan',t:'textarea',w:1}],e,async o=>{if(await save('ev',{...e,...o})){log((id?'memperbarui':'membuat')+' agenda "'+o.title+'"',o.sid);toast('Agenda tersimpan')}})}
function cmForm(sid,fid){const s=sp(sid);form('Riwayat Komunikasi — '+s.name,[{k:'at',l:'Tanggal',t:'date',req:1},{k:'method',l:'Metode',t:'select',o:METH},{k:'summary',l:'Ringkasan hasil komunikasi',t:'textarea',req:1,w:1},{k:'resp',l:'Respons sponsor',t:'textarea',w:1},{k:'act',l:'Tindak lanjut disepakati',w:1},{k:'next',l:'Follow-up berikutnya (opsional)',t:'date'}],{at:today(),method:'WhatsApp'},async o=>{
await save('cm',{...o,sid,by:ME});if(o.next){await save('ev',{title:'Follow-up '+s.name,date:o.next,cat:'Follow-up',sid,who:s.owner||ME,status:'Belum dimulai',note:o.act});await save('sp',{...s,next:o.next})}
if(fid){const e=S.ev.find(x=>x.id===fid);await save('ev',{...e,status:'Selesai'})}log('mencatat komunikasi dengan '+s.name,sid);toast('Riwayat tersimpan')})}
function doneFu(id){const e=S.ev.find(x=>x.id===id);if(e.sid&&sp(e.sid))cmForm(e.sid,id);else{save('ev',{...e,status:'Selesai'});log('menyelesaikan agenda "'+e.title+'"')}}
function delEv(id){if(confirm('Hapus agenda ini?')){del('ev',id);toast('Agenda dihapus')}}
function delSp(id){if(confirm('Hapus sponsor ini beserta riwayatnya?')){S.cm.filter(c=>c.sid===id).forEach(c=>del('cm',c.id));S.ev.filter(c=>c.sid===id).forEach(c=>del('ev',c.id));del('sp',id);log('menghapus sponsor '+spn(id));go('sp')}}
/* VIEWS */
const badge=s=>`<span class="bg ${s==='Terlambat'?'late':s==='Diterima'||s==='Selesai'?'ok':''}">${esc(s)}</span>`;
const evRow=e=>`<div class=li><div><b>${esc(e.title)}</b><div class=mu>${fd(e.date)} ${esc(e.time||'')} · ${esc(e.cat)} · ${esc(nm(e.who))}${e.sid?' · '+esc(spn(e.sid)):''}</div></div><div>${badge(eff(e))}</div></div>`;
const sum=(f)=>S.sp.filter(s=>s.type==='Uang'||!s.type).reduce((a,s)=>a+(+s[f]||0),0);
function dash(){const t=today(),n=s=>S.sp.filter(x=>s.includes(x.status)).length,tg=+S.set.target||0,rc=sum('recv');
const card=(a,b)=>`<div class="cd st"><b>${a}</b><span>${b}</span></div>`;
const up=S.ev.filter(e=>e.status!=='Selesai'&&e.date>=t).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
const fu=S.ev.filter(e=>e.cat==='Follow-up'&&e.status!=='Selesai'&&e.date<=t).sort((a,b)=>a.date.localeCompare(b.date));
const od=S.sp.filter(s=>s.next&&s.next<t&&!['Diterima','Ditolak'].includes(s.status));
return`<h2>Dashboard</h2><div class=g>${card(S.sp.length,'Total calon sponsor')}${card(n(['Belum dihubungi','Akan dihubungi']),'Belum dihubungi')}${card(n(['Sudah dihubungi','Menunggu respons','Negosiasi']),'Dalam proses')}${card(n(['Diterima']),'Dikonfirmasi')}${card(n(['Perlu follow-up']),'Perlu follow-up')}${card(tg?rp(tg):'Belum ditentukan','Target dana')}${card(rp(sum('conf')),'Dana terkonfirmasi')}${card(tg?(rc/tg*100).toFixed(1)+'%':'—','Pencapaian (dana diterima)')}</div>
<div class=cd><h3>Progres target dana</h3><div class=bar><i style="width:${tg?Math.min(100,rc/tg*100):0}%"></i></div><span class=mu>${tg?rp(rc)+' diterima dari '+rp(tg):'Target belum ditentukan'}</span></div>
<div class=g2><div class=cd><h3>Agenda terdekat</h3>${up.map(evRow).join('')||'<div class=em>Belum ada agenda mendatang.</div>'}</div>
<div class=cd><h3>Follow-up yang harus dilakukan</h3>${fu.map(evRow).join('')||'<div class=em>Tidak ada follow-up tertunda.</div>'}</div>
<div class=cd><h3>Sponsor melewati tenggat</h3>${od.map(s=>`<div class=li><a href=# onclick="go('det','${s.id}');return false">${esc(s.name)}</a><span class="bg late">${fd(s.next)}</span></div>`).join('')||'<div class=em>Tidak ada.</div>'}</div>
<div class=cd><h3>Aktivitas komunikasi terbaru</h3>${[...S.cm].sort((a,b)=>b.cr-a.cr).slice(0,5).map(c=>`<div class=li><div><b>${esc(spn(c.sid))}</b> · ${esc(c.method)}<div class=mu>${esc(c.summary)}</div></div><span class=mu>${esc(nm(c.by))}</span></div>`).join('')||'<div class=em>Belum ada komunikasi tercatat.</div>'}</div></div>
<div class=cd><h3>Pusat aktivitas tim</h3>${[...S.ac].sort((a,b)=>b.at-a.at).slice(0,8).map(a=>`<div class=li><div><b>${esc(nm(a.by))}</b> ${esc(a.text)}</div><span class=mu>${ft(a.at)}</span></div>`).join('')||'<div class=em>Belum ada aktivitas.</div>'}</div>`}
function cal(){const y=CM.getFullYear(),m=CM.getMonth(),t=today(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let h='';
['Sen','Sel','Rab','Kam','Jum','Sab','Min'].forEach(d=>h+=`<div class=h>${d}</div>`);for(let i=0;i<first;i++)h+='<div></div>';
for(let d=1;d<=days;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,es=S.ev.filter(e=>e.date===k);h+=`<div class="dy ${k===t?'td':''} ${k===SEL?'sel':''}" onclick="SEL='${k}';render()"><small>${d}</small>${es.slice(0,3).map(e=>`<span class="ev ${e.status==='Selesai'?'dn':''}" ${eff(e)==='Terlambat'?'style=background:var(--r)':''}>${esc(e.title)}</span>`).join('')}${es.length>3?`<small>+${es.length-3}</small>`:''}</div>`}
const mn=CM.toLocaleDateString('id-ID',{month:'long',year:'numeric'}),sel=SEL?S.ev.filter(e=>e.date===SEL):[];
return`<h2>Timeline Kalender</h2><div class=tb><button class=bt ${m===9?'disabled':''} onclick="cm(-1)">‹</button><b style="flex:1;text-align:center">${mn}</b><button class=bt ${m===11?'disabled':''} onclick="cm(1)">›</button><button class="bt p" onclick="evForm()">+ Tambah Agenda</button></div><div class=cal>${h}</div>
<div class=cd style="margin-top:12px"><h3>${SEL?'Agenda '+fd(SEL):'Klik tanggal untuk melihat agenda'}</h3>${SEL?(sel.map(e=>evRow(e)+actEv(e)).join('')||'<div class=em>Tidak ada agenda pada tanggal ini.</div>'):''}</div>`}
const cm=d=>{CM=new Date(2026,CM.getMonth()+d,1);SEL=null;render()};
const actEv=e=>`<div style="text-align:right;padding-bottom:6px"><button class="bt s" onclick="doneFu('${e.id}')">Selesai</button> <button class="bt s" onclick="evForm('${e.id}')">Edit</button> <button class="bt s d" onclick="delEv('${e.id}')">Hapus</button></div>`;
function spList(){let l=S.sp.filter(s=>(!F.q||(s.name+s.pic+s.cat).toLowerCase().includes(F.q.toLowerCase()))&&(!F.st||s.status===F.st)&&(!F.cat||s.cat===F.cat)&&(!F.own||s.owner===F.own));
l.sort((a,b)=>F.sort==='est'?(b.est||0)-(a.est||0):F.sort==='next'?(a.next||'9').localeCompare(b.next||'9'):a.name.localeCompare(b.name));
const cats=[...new Set(S.sp.map(s=>s.cat).filter(Boolean))],op=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
return`<h2>Daftar Sponsor</h2><div class=tb><input placeholder="Cari sponsor…" value="${esc(F.q)}" oninput="F.q=this.value;render(1)" id=q><select onchange="F.st=this.value;render()"><option value="">Semua status</option>${op(STS,F.st)}</select><select onchange="F.cat=this.value;render()"><option value="">Semua kategori</option>${op(cats,F.cat)}</select><select onchange="F.own=this.value;render()"><option value="">Semua PJ</option>${S.mem.map(m=>`<option value="${m.id}" ${m.id===F.own?'selected':''}>${esc(nm(m.id))}</option>`).join('')}</select><select onchange="F.sort=this.value;render()"><option value=name>Urut: Nama</option><option value=next ${F.sort==='next'?'selected':''}>Urut: Follow-up</option><option value=est ${F.sort==='est'?'selected':''}>Urut: Nilai</option></select><button class="bt p" onclick="spForm()">+ Tambah Sponsor</button></div>
<div class="cd ov">${l.length?`<table><tr><th>Sponsor</th><th>Kategori</th><th>PJ</th><th>Status</th><th>Follow-up</th><th>Estimasi</th><th></th></tr>${l.map(s=>`<tr><td><a href=# onclick="go('det','${s.id}');return false"><b>${esc(s.name)}</b></a>${s.contoh?' <span class=bg>Contoh</span>':''}</td><td>${esc(s.cat)}</td><td>${esc(nm(s.owner))}</td><td><select style="width:auto" onchange="setStatus('${s.id}',this.value)">${STS.map(x=>`<option ${x===s.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${fd(s.next)}</td><td>${rp(s.est)}${s.type&&s.type!=='Uang'?' ('+s.type+')':''}</td><td><button class="bt s" onclick="spForm('${s.id}')">Edit</button> <button class="bt s d" onclick="delSp('${s.id}')">Hapus</button></td></tr>`).join('')}</table>`:'<div class=em>Belum ada sponsor yang cocok. Klik “Tambah Sponsor” untuk memulai.</div>'}</div>`}
